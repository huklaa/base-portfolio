<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Explorer provider diagnostic</title><h1>Explorer provider diagnostic</h1><p>This read-only check reveals no credentials and makes no wallet requests.</p><button id="check">Check provider configuration</button><pre id="result" role="status">Not checked</pre><script>
document.getElementById('check').onclick=async()=>{const out=document.getElementById('result');out.textContent='Checking…';try{const response=await fetch('/api/explorer-config',{signal:AbortSignal.timeout(5000),cache:'no-store'});const data=await response.json();out.textContent='HTTP '+response.status+'\nConfigured: '+(data.configured===true?'true':'false');}catch{out.textContent='Configuration check failed';}};
</script></html>
