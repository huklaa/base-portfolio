<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Explorer provider diagnostic</title><h1>Explorer provider diagnostic</h1><p>Read-only provider checks. No credentials are displayed.</p><button id="check">Check provider configuration</button><button id="history">Check Base history</button><pre id="result" role="status">Not checked</pre><script>
const out=document.getElementById('result');
document.getElementById('check').onclick=async()=>{out.textContent='Checking…';try{const r=await fetch('/api/explorer-config',{signal:AbortSignal.timeout(5000),cache:'no-store'});out.textContent='HTTP '+r.status+'\n'+JSON.stringify(await r.json(),null,2);}catch(e){out.textContent='Configuration failed: '+e.message;}};
document.getElementById('history').onclick=async()=>{out.textContent='Checking…';try{const r=await fetch('/api/history?address=0x39d9943779f5f26ad7b86f5e21eb7d50073308c2&from=0',{signal:AbortSignal.timeout(15000),cache:'no-store'});const d=await r.json();out.textContent='HTTP '+r.status+'\n'+JSON.stringify({...d,...(Array.isArray(d.result)?{resultCount:d.result.length,result:d.result.slice(0,1)}:{})},null,2);}catch(e){out.textContent='History failed: '+e.message;}};
</script></html>
