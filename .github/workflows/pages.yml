name: Deploy Base Portfolio Reader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preserved Base Portfolio Reader source
        uses: actions/checkout@v4
        with:
          repository: huklaa/crypto-test
          ref: 059fd2705b2480d327ce7ff4e7920fb636b270f9
          path: source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: source
        run: npm install

      - name: Build for base-portfolio path
        working-directory: source
        run: |
          sed -i 's#/crypto-test/#/base-portfolio/#g' vite.config.js
          npm run demo:build
          sed -i 's#</head>#<meta name="talentapp:project_verification" content="c4dddfa0d0c65483fa7cd312956c5db3215320c0671ea2fefeee801a03938bc23ff9604c0c181c39767029f6d3325ad38c1167265aeee2e5dd0117e426d924e9">\n</head>#' dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
