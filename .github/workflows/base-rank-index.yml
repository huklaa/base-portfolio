name: Refresh Base rank index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/index-base-rank.mjs'
      - '.github/workflows/base-rank-index.yml'
      - 'rank.js'
      - 'production-fixes.js'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: base-rank-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh rank sample
        run: node scripts/index-base-rank.mjs

      - name: Commit updated index
        run: |
          if git diff --quiet -- data/base-rank-index.json; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "base-portfolio-indexer[bot]"
          git config user.email "base-portfolio-indexer[bot]@users.noreply.github.com"
          git add data/base-rank-index.json
          git commit -m "data(rank): refresh Base wallet index"
          git push origin HEAD:main
