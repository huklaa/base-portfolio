name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check app.js
          node --check behavior-delta.js
          node --check app-graph.js
      - name: Behavior delta tests
        run: node tests/behavior-delta.test.mjs
      - name: App graph tests
        run: node tests/app-graph.test.mjs
